<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>行为录制回放</title>
  <style>
    :root {
      --bg-primary: #1e1e1e;
      --bg-secondary: #252526;
      --bg-hover: #37373d;
      --border-color: #3e3e42;
      --text-primary: #cccccc;
      --text-secondary: #969696;
      --text-bright: #ffffff;
      --accent-blue: #007acc;
      --accent-green: #4ec951;
      --accent-red: #f44747;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      font-family: var(--font-sans);
      font-size: 13px;
      color: var(--text-primary);
      background: var(--bg-primary);
      padding: 14px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .logo {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-bright);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 10px;
      background: var(--bg-secondary);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-secondary);
    }

    .status-dot.recording {
      background: var(--accent-red);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .main-hint {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 32px 16px;
      text-align: center;
      background: var(--bg-secondary);
      border-radius: 8px;
      border: 1px solid var(--border-color);
      margin-bottom: 14px;
    }

    .hint-icon {
      font-size: 48px;
      line-height: 1;
    }

    .hint-text {
      font-size: 14px;
      color: var(--text-primary);
      line-height: 1.6;
    }

    .hint-text strong {
      color: var(--text-bright);
      font-weight: 600;
    }

    .hint-key {
      display: inline-block;
      padding: 2px 8px;
      font-size: 12px;
      font-family: monospace;
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      color: var(--accent-blue);
    }

    .footer {
      padding-top: 12px;
      border-top: 1px solid var(--border-color);
      text-align: center;
      font-size: 11px;
      color: var(--text-secondary);
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <span>&#128225;</span>
      行为录制回放
    </div>
    <div class="status-badge">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">空闲</span>
    </div>
  </div>

  <div class="main-hint">
    <div class="hint-icon">&#128225;</div>
    <div class="hint-text">
      按 <span class="hint-key">F12</span> 打开开发者工具<br>
      切换到<strong>「行为录制回放」</strong>面板<br>
      在此面板中进行录制和回放操作
    </div>
  </div>

  <div class="footer">
    所有操作请在 DevTools 面板中完成
  </div>

  <script src="popup.js"></script>
</body>
</html>
